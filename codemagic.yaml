workflows:
  ios-swiftui-fittrack:
    name: FitTrack iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode Project via XcodeGen
        script: |
          # Remove resquícios de compilações antigas que geram erros de bundle
          rm -rf *.xcodeproj
          rm -rf build
          
          # Instala e força a leitura do novo project.yml da raiz
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Build Unsigned IPA
        script: |
          # Compila o projeto nativo estruturado
          xcodebuild -project FitTrack.xcodeproj -scheme FitTrack -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
          
          # Monta a árvore exata que o iOS e a AltStore exigem
          mkdir -p build/ios/ipa/Payload
          cp -r build/Release-iphoneos/FitTrack.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -y -r FitTrack.ipa Payload/
    artifacts:
      - build/ios/ipa/*.ipa
