workflows:
  ios-swiftui-fittrack:
    name: FitTrack iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Clean and Generate Project
        script: |
          rm -rf *.xcodeproj build
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Build and Force Archive Package
        script: |
          # Compila criando um arquivo nativo estruturado completo
          xcodebuild -project FitTrack.xcodeproj -scheme FitTrack -sdk iphoneos -configuration Release -archivePath build/FitTrack.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          
          # Garante a árvore de subpastas Payload exigida pelo iOS
          mkdir -p build/ios/ipa/Payload
          
          # Extrai o bundle de aplicação real gerado pelo arquivo do Xcode
          cp -r build/FitTrack.xcarchive/Products/Applications/FitTrack.app build/ios/ipa/Payload/
          
          # Injeta o Info.plist validado no coração do pacote
          cp Info.plist build/ios/ipa/Payload/FitTrack.app/
          
          # Compacta preservando os links e formatos binários da Apple
          cd build/ios/ipa && zip -y -r FitTrack.ipa Payload/
    artifacts:
      - build/ios/ipa/*.ipa
