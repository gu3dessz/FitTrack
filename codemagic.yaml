workflows:
  ios-swiftui-fittrack:
    name: FitTrack iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Initialize Swift Package Manifest
        script: |
          echo "// swift-tools-version: 6.0" > Package.swift
          echo "import PackageDescription" >> Package.swift
          echo "let package = Package(name: \"FitTrack\", platforms: [.iOS(.v17)], products: [.executable(name: \"FitTrack\", targets: [\"FitTrack\"])], targets: [.target(name: \"FitTrack\", path: \"FitTrack\")])" >> Package.swift
      - name: Build and Package Application
        script: |
          # Compila gerando um arquivo de arquivo nativo (.xcarchive)
          xcodebuild -buildwithpackage Package.swift -scheme FitTrack -sdk iphoneos -configuration Release -archivePath build/FitTrack.xcarchive archive
          
          # Cria a estrutura correta do Payload que a AltStore exige
          mkdir -p build/ios/ipa/Payload
          cp -r build/FitTrack.xcarchive/Products/Applications/FitTrack.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -y -r FitTrack.ipa Payload/
    artifacts:
      - build/ios/ipa/*.ipa