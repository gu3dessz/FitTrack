workflows:
  ios-swiftui-fittrack:
    name: FitTrack iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode Project via XcodeGen
        script: |
          # Garante a instalação limpa e força a geração do projeto Apple nativo
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Build Unsigned IPA
        script: |
          # Compila o projeto simulando o Xcode real diretamente da pasta do workspace
          xcodebuild -project FitTrack.xcodeproj -scheme FitTrack -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
          
          # Garante a estrutura Payload correta exigida pela AltStore
          mkdir -p build/ios/ipa/Payload
          cp -r build/Release-iphoneos/FitTrack.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -y -r FitTrack.ipa Payload/
    artifacts:
      - build/ios/ipa/*.ipa
